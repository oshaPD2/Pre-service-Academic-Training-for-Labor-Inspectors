law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060009"}, {"label": "全國法規資料庫－感染性生物材料管理辦法", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0050029"}]}, {"no": 51, "title": "職業安全衛生設施規則（衛生部分）", "hours": "3 hr", "category": "職業衛生與健康", "goal": "掌握職業安全衛生設施規則中衛生相關規定，能辨識通風、照明、清潔、休息及有害作業等常見查核重點。", "free": [{"label": "職業安全衛生數位學習平台｜化學設施管線及儲槽作業", "url": "https://isafeel.osha.gov.tw/info/10000140"}], "refs": [{"label": "全國法規資料庫－職業安全衛生設施規則（衛生相關規定）", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060009"}, {"label": "全國法規資料庫－精密作業勞工視機能保護設施標準", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060012"}, {"label": "全國法規資料庫－高溫作業勞工作息時間標準", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060007"}]}, {"no": 52, "title": "勞工健康服務與管理實務", "hours": "2 hr", "category": "職業衛生與健康", "goal": "理解勞工健康服務、健康檢查與健康管理制度，掌握醫護人員配置、健康風險管理及職場健康促進之實務重點。", "free": [], "refs": [{"label": "全國法規資料庫－勞工健康保護規則", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060022"}, {"label": "勞動部勞動法令查詢系統－勞工健康服務專業機構管理規則（116年1月1日施行）", "url": "https://laws.mol.gov.tw/FLAW/FLAWDAT01.aspx?id=FL106718"}, {"label": "勞動部勞動法令查詢系統－辦理勞工體格與健康檢查醫療機構認可及管理辦法", "url": "https://laws.mol.gov.tw/flaw/FLAWDAT01.aspx?id=FL015055"}]}, {"no": 53, "title": "職業衛生測量儀器簡介", "hours": "2 hr", "category": "職業衛生與健康", "goal": "認識職業衛生常用測量儀器之原理、用途與限制，建立採樣、量測、校正及結果判讀之基本能力。", "free": [], "refs": [{"label": "全國法規資料庫－勞工作業環境監測實施辦法", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060033"}, {"label": "全國法規資料庫－勞工作業場所容許暴露標準", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060004"}]}];
const cats=['全部','勞動及一般法令','勞動檢查','一般安全衛生','職業安全','職業衛生與健康','有網路免費課程'];
let active='全部';
const grid=document.getElementById('grid'), q=document.getElementById('q'), count=document.getElementById('count'), chips=document.getElementById('chips');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function linkList(items,label){if(!items.length)return '';return `<h3>${label}</h3><ul>${items.map(x=>`<li><a class="link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><span class="icon">↗</span><span class="linktxt">${esc(x.label)}</span><span class="ext">開啟</span></a></li>`).join('')}</ul>`}
function card(c){return `<article class="card" data-no="${c.no}"><details id="course-${c.no}"><summary><span class="no">${c.no}</span><span><div class="title">${esc(c.title)}</div><div class="meta"><span class="tag">${esc(c.category)}</span>${c.free.length?`<span class="tag">免費課程 ${c.free.length}</span>`:''}<span class="tag">參考資料 ${c.refs.length}</span></div></span><span class="hours">${esc(c.hours)}</span></summary><div class="body"><p class="goal"><strong>課程目標：</strong>${esc(c.goal)}</p>${linkList(c.free,'網路免費課程')}${linkList(c.refs,'參考資料')}</div></details></article>`}
function render(){const term=q.value.trim().toLowerCase();const list=courses.filter(c=>{const filter=active==='全部'||(active==='有網路免費課程'?c.free.length>0:c.category===active);const hay=[c.title,c.goal,c.category,...c.free.map(x=>x.label),...c.refs.map(x=>x.label)].join(' ').toLowerCase();return filter&&(!term||hay.includes(term));});count.textContent=list.length;grid.innerHTML=list.length?list.map(card).join(''):'<div class="empty">找不到符合條件的課程，請更換關鍵字或分類。</div>';if(location.hash){const el=document.querySelector(location.hash);if(el){el.open=true;setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),50);}}}
cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c===active?' active':'');b.textContent=c;b.onclick=()=>{active=c;[...chips.children].forEach(x=>x.classList.toggle('active',x.textContent===c));render();};chips.appendChild(b);});
q.addEventListener('input',render);document.getElementById('clear').onclick=()=>{q.value='';active='全部';[...chips.children].forEach(x=>x.classList.toggle('active',x.textContent==='全部'));render();q.focus();};
let expanded=false;document.getElementById('expand').onclick=e=>{expanded=!expanded;document.querySelectorAll('details').forEach(d=>d.open=expanded);e.target.textContent=expanded?'收合全部':'展開全部';};
render();
</script>
